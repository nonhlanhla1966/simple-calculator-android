# Project-wide Gradle settings.

# JVM heap size for the Gradle daemon. Kept modest since this is a small project.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use the AndroidX package structure (required for all modern Android libraries).
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes
# only the resources declared in the library itself, speeding up builds.
android.nonTransitiveRClass=true

# Run Gradle tasks in parallel where possible for faster builds.
org.gradle.parallel=true
org.gradle.caching=true
