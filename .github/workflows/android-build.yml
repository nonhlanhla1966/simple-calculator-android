name: Android CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-test:
    name: Test engine, build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1. Unit tests ──────────────────────────────────────────────────────
      # CalculatorEngine.kt has zero Android framework imports, so we test it
      # directly with kotlinc + JUnit4 on a plain JVM — exactly as was verified
      # in the build environment before this project was pushed to GitHub.
      # This is both faster and more reliable than routing pure-Kotlin logic
      # through the Android Gradle Plugin.
      - name: Install Kotlin compiler and JUnit4
        run: sudo apt-get install -y --no-install-recommends kotlin junit4

      - name: Compile calculator engine and its unit tests
        run: |
          mkdir -p /tmp/test-classes
          kotlinc \
            app/src/main/java/com/simplecalc/app/CalculatorEngine.kt \
            app/src/test/java/com/simplecalc/app/CalculatorEngineTest.kt \
            -cp /usr/share/java/junit4.jar \
            -d /tmp/test-classes \
            2>&1 | grep -v "^OpenJDK"

      - name: Run 33 unit tests (addition, subtraction, multiplication, division,
            decimals, negatives, percent, divide-by-zero, AC, backspace, chaining)
        run: |
          java -cp "/tmp/test-classes:/usr/share/java/kotlin-stdlib.jar:/usr/share/java/junit4.jar:/usr/share/java/hamcrest-core.jar" \
            org.junit.runner.JUnitCore com.simplecalc.app.CalculatorEngineTest

      # ── 2. Android APK build ───────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-build-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-calculator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build installable APK
        run: ./gradlew assembleDebug --stacktrace --no-build-cache

      - name: Rename APK for release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk \
             "release-output/SimpleCalculator-${{ github.ref_name }}.apk"

      - name: Delete previous release if exists
        run: |
          gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/*.apk
          generate_release_notes: true
          name: Simple Calculator ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
