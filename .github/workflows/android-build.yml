name: Android CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-test:
    name: Test engine, build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Unit tests: pure JVM, no Android toolchain needed ─────────────────
      # CalculatorEngine.kt has zero Android framework imports. We compile and
      # run its 33 tests directly using Kotlin 1.9.24 (same version as the
      # Gradle build) downloaded from JetBrains, so this step is self-contained
      # with no dependency on apt or the Android SDK.
      - name: Run calculator engine unit tests (pure JVM)
        run: |
          set -e

          # ── Download Kotlin 1.9.24 compiler ──────────────────────────────
          wget -q "https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip" \
               -O /tmp/kotlin-compiler.zip
          unzip -q /tmp/kotlin-compiler.zip -d /tmp/kotlin-dist
          KOTLINC="/tmp/kotlin-dist/kotlinc/bin/kotlinc"
          KOTLIN_STDLIB="/tmp/kotlin-dist/kotlinc/lib/kotlin-stdlib.jar"
          "$KOTLINC" -version 2>&1 | grep -v "^OpenJDK" || true

          # ── Download JUnit 4.13.2 + Hamcrest 1.3 from Maven Central ──────
          wget -q "https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar" \
               -O /tmp/junit4.jar
          wget -q "https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar" \
               -O /tmp/hamcrest.jar

          # ── Compile engine + tests ────────────────────────────────────────
          mkdir -p /tmp/test-classes
          "$KOTLINC" \
            app/src/main/java/com/simplecalc/app/CalculatorEngine.kt \
            app/src/test/java/com/simplecalc/app/CalculatorEngineTest.kt \
            -cp /tmp/junit4.jar \
            -d /tmp/test-classes \
            2>&1 | grep -v "^OpenJDK"

          # ── Run 33 tests ──────────────────────────────────────────────────
          java -cp "/tmp/test-classes:$KOTLIN_STDLIB:/tmp/junit4.jar:/tmp/hamcrest.jar" \
            org.junit.runner.JUnitCore com.simplecalc.app.CalculatorEngineTest

      # ── Android APK build ─────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-build-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-calculator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build installable APK
        run: ./gradlew assembleDebug --stacktrace --no-build-cache

      - name: Rename APK for release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk \
             "release-output/SimpleCalculator-${{ github.ref_name }}.apk"

      - name: Delete previous release if exists
        run: gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/*.apk
          generate_release_notes: true
          name: Simple Calculator ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
