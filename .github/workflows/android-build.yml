name: Android CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-test:
    name: Test engine, build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1. Unit tests — pure JVM, self-contained ───────────────────────────
      - name: Download Kotlin 1.9.24 compiler
        run: |
          curl -sL \
            "https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip" \
            -o /tmp/kotlin-compiler.zip
          unzip -q /tmp/kotlin-compiler.zip -d /tmp
          /tmp/kotlinc/bin/kotlinc -version 2>&1 | head -3 || true

      - name: Download JUnit 4.13.2 and Hamcrest 1.3
        run: |
          curl -sL "https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar" \
               -o /tmp/junit4.jar
          curl -sL "https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar" \
               -o /tmp/hamcrest.jar

      - name: Compile CalculatorEngine + unit tests
        run: |
          mkdir -p /tmp/test-classes
          /tmp/kotlinc/bin/kotlinc \
            app/src/main/java/com/simplecalc/app/CalculatorEngine.kt \
            app/src/test/java/com/simplecalc/app/CalculatorEngineTest.kt \
            -cp /tmp/junit4.jar \
            -d /tmp/test-classes
          echo "Compilation successful."

      - name: Run 33 unit tests
        run: |
          java \
            -cp "/tmp/test-classes:/tmp/kotlinc/lib/kotlin-stdlib.jar:/tmp/junit4.jar:/tmp/hamcrest.jar" \
            org.junit.runner.JUnitCore \
            com.simplecalc.app.CalculatorEngineTest

      # ── 2. Android APK build ───────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-build-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-calculator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build installable APK
        run: ./gradlew assembleDebug --stacktrace --no-build-cache

      - name: Rename APK for release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk \
             "release-output/SimpleCalculator-${{ github.ref_name }}.apk"

      - name: Delete previous release if exists
        run: gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/*.apk
          generate_release_notes: true
          name: Simple Calculator ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
